name: CI - MAXCUT Regression & Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Regression Suite & Artifact Verification
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run automated unit and regression test suite
        run: |
          pytest -v --durations=10

      - name: Validate required artifacts and pre-rendered notebook
        run: |
          python scripts/validate_artifacts.py

      - name: Verify working tree clean (no committed artifacts rewritten)
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
